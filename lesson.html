<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="#13253c" name="theme-color"/><title>Code Reader | 構文レッスン</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17263a;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:#13253c;color:#fff;padding:22px max(20px,calc((100% - 850px)/2))}header strong{font-size:22px}header small{display:block;color:#b1c0d4;margin-top:5px}main{max-width:890px;margin:auto;padding:25px 18px 65px}.card{background:white;border:1px solid #e0e7f0;border-radius:15px;padding:22px;margin:15px 0}h1{font-size:27px;margin:6px 0 7px}h2{font-size:18px;margin:2px 0 14px}p{line-height:1.85}.muted{color:#64748b;font-size:14px}.badge{display:inline-block;background:#e9efff;color:#3559b1;padding:6px 10px;border-radius:8px;font-size:12px}.code{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.75 ui-monospace,Consolas,monospace;background:#17263a;color:#f5f8ff;padding:17px;border-radius:11px}.small{background:#f1f5fa;color:#25344c}.tip{background:#eef5ff;border-left:4px solid #5b7ec3;padding:12px 16px;border-radius:4px;line-height:1.8}a{color:#2453bd}button{cursor:pointer;border:0;background:#3159d8;color:#fff;border-radius:8px;padding:12px 17px;font-size:15px;font-weight:700;min-height:44px}.btn-row{display:flex;align-items:center;flex-wrap:wrap;gap:12px}.result{font-size:14px;line-height:1.8}.step{border-bottom:1px solid #e8edf4;padding:8px 0} .step:last-child{border:0}@media(max-width:580px){main{padding:18px 12px 40px}.card{padding:16px}h1{font-size:23px}}
/* Code Reader v0.4 — editorial workspace refresh */

:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222d3a;background:#f5f4f0;--ink:#222d3a;--muted:#727e8c;--line:#e1e4e7;--accent:#326257;--accent-dark:#234a42;--paper:#fff;--code:#1e2831}
body{background:#f5f4f0;color:var(--ink);letter-spacing:.005em}
header{background:#fcfbf8;color:var(--ink);border-bottom:1px solid #e6e4df;padding-top:20px;padding-bottom:20px}
header strong{display:inline-flex;align-items:center;gap:12px;color:#27332f;font-size:20px;font-weight:750;letter-spacing:-.045em}
header strong:before{content:'{ }';display:inline-grid;place-items:center;width:34px;height:34px;background:#315c51;color:white;border:1px solid #224c41;border-radius:9px;font:700 15px/1 Consolas,monospace;box-shadow:0 3px 0 #19372f,0 5px 10px rgba(14,37,27,.13),inset 0 1px 0 rgba(255,255,255,.2)}
header small{color:#78827c;margin-top:5px;font-size:12px;letter-spacing:.045em}
h1,h2,h3{color:#252f32;letter-spacing:-.04em}h1{font-weight:760}h2{font-weight:735}
.panel,.card{background:#fff;border:1px solid #e4e4e0;border-radius:13px;box-shadow:0 2px 4px rgba(26,35,31,.03),0 10px 28px rgba(26,35,31,.045),inset 0 1px 0 #fff}
.muted{color:#7a858a} .label{color:#3f4c50;font-size:12px;letter-spacing:.025em}
textarea,input,select{border:1px solid #d9ddde;border-radius:8px;background:#fcfcfb;color:#25353b;box-shadow:inset 0 1px 3px rgba(27,42,45,.045),0 1px 0 #fff;transition:border-color .17s,box-shadow .17s}
textarea:focus,input:focus,select:focus{outline:none;border-color:#668b7f;box-shadow:0 0 0 3px rgba(49,98,87,.13),inset 0 1px 2px rgba(27,42,45,.04)}
button{background:linear-gradient(180deg,#467b6e 0%,#315f54 100%);border:1px solid #28554b;color:white;border-radius:9px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -1px 0 rgba(0,0,0,.1),0 3px 0 #21493f,0 6px 10px rgba(26,63,52,.13);font-weight:700;letter-spacing:.01em;transition:transform .12s,box-shadow .12s,filter .12s}
button:hover{filter:brightness(1.045)}button:active{transform:translateY(2px);box-shadow:inset 0 2px 4px rgba(0,0,0,.13),0 1px 0 #21493f}button:focus-visible,a:focus-visible{outline:3px solid #9abcb3;outline-offset:3px}
button.alt,button.outline,.history button{background:linear-gradient(180deg,#fff,#f0f1ee);border:1px solid #d9deda;color:#3a534b;box-shadow:inset 0 1px 0 white,0 3px 0 #d2d7d3,0 5px 9px rgba(35,53,45,.08)}
button.alt:active,button.outline:active,.history button:active{box-shadow:inset 0 1px 3px #d7dcd8,0 1px 0 #d2d7d3}
.badge{background:#eef2ef;color:#43665a;border:1px solid #e3ebe5;border-radius:6px;font-weight:650}
.topic{background:linear-gradient(180deg,#fff,#fcfcfb);border-color:#e1e5e1;border-radius:9px;color:#2a403b;box-shadow:0 2px 0 #e6eae6,0 3px 7px rgba(21,39,31,.045);transition:transform .14s,box-shadow .14s,border-color .14s}
.topic:hover{background:#f7faf8;border-color:#9eb5a9;transform:translateY(-1px);box-shadow:0 3px 0 #d5ded6,0 5px 10px rgba(21,39,31,.08)}
.topic:active{transform:translateY(1px);box-shadow:0 1px 0 #d5ded6}
.topic.active{border-color:#7a9a87;background:#f3f8f3}.topic .count{color:#81928b}
.snippet,.code:not(.small){background:#202b31;border:1px solid #142026;box-shadow:inset 0 2px 5px rgba(0,0,0,.15);color:#e7efe9}
.example,.small{background:#f1f4f1;color:#2b4640;border:1px solid #e4ebe5}
.callout,.tip{background:#f2f6f2;border:1px solid #e2eae3;border-left:3px solid #81a38f;border-radius:6px;color:#5f7566}
a{color:#32675b}
@media (prefers-reduced-motion:reduce){button,.topic,input,textarea,select{transition:none!important}}

main{max-width:900px;padding:31px 18px 72px}main>a{display:inline-flex;margin:2px 0 12px;text-decoration:none;font-size:13px;font-weight:650;color:#3c6659}main>a:hover{text-decoration:underline}.card{padding:28px;margin:17px 0}.card:first-child{padding:32px 28px;border-top:3px solid #7da18e}.card:first-child h1{font-size:35px;margin-top:13px}.card h2{font-size:17px;margin-bottom:15px}.step{padding:13px 0;border-color:#edf0ec}.step strong{font-size:14px}.step p{margin:7px 0 4px;font-size:14px;color:#5c6c6b}.code{font-size:13px;line-height:1.9;border-radius:9px}.tip{line-height:1.9;padding:16px}.btn-row{margin-top:18px;gap:17px}@media(max-width:600px){.card{padding:20px}.card:first-child{padding:23px 20px}.card:first-child h1{font-size:27px}}
</style></head><body><header><strong>Code Reader</strong><small>SYNTAX NOTEBOOK / MINI LESSON</small></header><main><a href="./index.html">← 構文一覧に戻る</a><div id="view"><section class="card"><p>レッスンを読み込み中です．</p></section></div></main><script>(()=>{'use strict';const root=document.getElementById('view'),p=new URLSearchParams(location.search),noteId=p.get('note'),key=p.get('topic');let notes=[];try{notes=JSON.parse(localStorage.getItem('code-reader-v2')||'[]')}catch{}const n=Array.isArray(notes)?notes.find(x=>x.id===noteId):null,t=n?.topics?.find(x=>x.key===key);function el(tag,cls,content){const e=document.createElement(tag);if(cls)e.className=cls;if(content!==undefined)e.textContent=content;return e}function card(title){const c=el('section','card');c.append(el('h2','',title));root.append(c);return c}if(!n||!t){root.replaceChildren();const c=card('レッスンを表示できません');c.append(el('p','','該当する学習履歴が見つかりません．元の画面で「構文を抽出する」を押してから開き直してください．同じブラウザを使用してください．'));return}document.title=t.name+' | Code Reader';root.replaceChildren();const hero=card('学習テーマ');hero.append(el('span','badge',n.lang+' / '+n.title),el('h1','',t.name),el('p','',t.description));const demo=card('1．まずは短いコードで理解');demo.append(el('p','muted','最小限の使用例です．ここから読み始めてください．'),el('pre','code',t.example));const guides={enumerate:[['対象を準備','リストに複数の値を入れます．'],['enumerate() を使う','各要素に0から始まる番号を付けます．'],['2つの変数で受け取る','i に番号, temp に要素が入ります．']],for:[['順番に取り出す','in の右側にある値を1つずつ取り出します．'],['変数へ代入','取り出した値が for の直後の変数に入ります．'],['インデント行を実行','繰り返しごとに print などの処理が実行されます．']],range:[['range(3)','0, 1, 2 の整数を順に得られます．'],['for と組み合わせる','決まった回数だけ処理を繰り返せます．']],function:[['def で定義','処理に関数名を付けます．'],['引数を渡す','括弧内の変数を通して値を受け取ります．'],['呼び出して実行','関数名に括弧を付けると中の処理が動きます．']],return:[['関数内で計算','引数などを使って結果を作ります．'],['return で返す','結果を呼び出し元へ渡して関数を終了します．']],fstring:[['先頭に f を付ける','文字列を f で始めます．'],['波括弧を使う','{temp} の部分に変数の値が埋め込まれます．']]};const explanation=card('2．読み方を分解');const steps=guides[key]||[['構文の役割',t.description],['書き方の注意点',t.point]];steps.forEach((x,i)=>{const d=el('div','step');d.append(el('strong','',String(i+1)+'．'+x[0]),el('p','',x[1]));explanation.append(d)});const actual=card('3．今回貼り付けたコードでは');actual.append(el('p','muted','実際に抽出された行を確認しましょう．'));for(const hit of (t.hits||[]).slice(0,6)){actual.append(el('span','badge','行 '+hit.line),el('pre','code small',hit.sample))}const caution=card('4．覚えておきたいポイント');caution.append(el('div','tip',t.point));const learn=card('5．理解度を記録');const row=el('div','btn-row'),btn=el('button','',n.learned?.[key]?'✓ 理解済み（クリックで解除）':'この構文を理解した'),status=el('span','muted','進捗は元の画面を再表示すると反映されます．');btn.addEventListener('click',()=>{try{const all=JSON.parse(localStorage.getItem('code-reader-v2')||'[]'),target=all.find(x=>x.id===noteId);if(!target)throw Error();target.learned??={};target.learned[key]=!target.learned[key];localStorage.setItem('code-reader-v2',JSON.stringify(all));btn.textContent=target.learned[key]?'✓ 理解済み（クリックで解除）':'この構文を理解した';status.textContent='学習状況を保存しました．元の画面に戻って再表示すると反映されます．'}catch{status.textContent='保存できませんでした．'}});row.append(btn,status);learn.append(row)})();</script></body></html>
