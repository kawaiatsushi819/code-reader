<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#13253c"><title>Code Reader | 構文レッスン</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17263a;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:#13253c;color:#fff;padding:22px max(20px,calc((100% - 850px)/2))}header strong{font-size:22px}header small{display:block;color:#b1c0d4;margin-top:5px}main{max-width:890px;margin:auto;padding:25px 18px 65px}.card{background:white;border:1px solid #e0e7f0;border-radius:15px;padding:22px;margin:15px 0}h1{font-size:27px;margin:6px 0 7px}h2{font-size:18px;margin:2px 0 14px}p{line-height:1.85}.muted{color:#64748b;font-size:14px}.badge{display:inline-block;background:#e9efff;color:#3559b1;padding:6px 10px;border-radius:8px;font-size:12px}.code{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.75 ui-monospace,Consolas,monospace;background:#17263a;color:#f5f8ff;padding:17px;border-radius:11px}.small{background:#f1f5fa;color:#25344c}.tip{background:#eef5ff;border-left:4px solid #5b7ec3;padding:12px 16px;border-radius:4px;line-height:1.8}a{color:#2453bd}button{cursor:pointer;border:0;background:#3159d8;color:#fff;border-radius:8px;padding:12px 17px;font-size:15px;font-weight:700;min-height:44px}.btn-row{display:flex;align-items:center;flex-wrap:wrap;gap:12px}.result{font-size:14px;line-height:1.8}.step{border-bottom:1px solid #e8edf4;padding:8px 0} .step:last-child{border:0}@media(max-width:580px){main{padding:18px 12px 40px}.card{padding:16px}h1{font-size:23px}}</style></head><body><header><strong>Code Reader</strong><small>構文を理解するためのミニレッスン</small></header><main><a href="./index.html">← 構文一覧に戻る</a><div id="view"><section class="card"><p>レッスンを読み込み中です．</p></section></div></main><script>(()=>{'use strict';const root=document.getElementById('view'),p=new URLSearchParams(location.search),noteId=p.get('note'),key=p.get('topic');let notes=[];try{notes=JSON.parse(localStorage.getItem('code-reader-v2')||'[]')}catch{}const n=Array.isArray(notes)?notes.find(x=>x.id===noteId):null,t=n?.topics?.find(x=>x.key===key);function el(tag,cls,content){const e=document.createElement(tag);if(cls)e.className=cls;if(content!==undefined)e.textContent=content;return e}function card(title){const c=el('section','card');c.append(el('h2','',title));root.append(c);return c}if(!n||!t){root.replaceChildren();const c=card('レッスンを表示できません');c.append(el('p','','該当する学習履歴が見つかりません．元の画面で「構文を抽出する」を押してから開き直してください．同じブラウザを使用してください．'));return}document.title=t.name+' | Code Reader';root.replaceChildren();const hero=card('学習テーマ');hero.append(el('span','badge',n.lang+' / '+n.title),el('h1','',t.name),el('p','',t.description));const demo=card('1．まずは短いコードで理解');demo.append(el('p','muted','最小限の使用例です．ここから読み始めてください．'),el('pre','code',t.example));const guides={enumerate:[['対象を準備','リストに複数の値を入れます．'],['enumerate() を使う','各要素に0から始まる番号を付けます．'],['2つの変数で受け取る','i に番号, temp に要素が入ります．']],for:[['順番に取り出す','in の右側にある値を1つずつ取り出します．'],['変数へ代入','取り出した値が for の直後の変数に入ります．'],['インデント行を実行','繰り返しごとに print などの処理が実行されます．']],range:[['range(3)','0, 1, 2 の整数を順に得られます．'],['for と組み合わせる','決まった回数だけ処理を繰り返せます．']],function:[['def で定義','処理に関数名を付けます．'],['引数を渡す','括弧内の変数を通して値を受け取ります．'],['呼び出して実行','関数名に括弧を付けると中の処理が動きます．']],return:[['関数内で計算','引数などを使って結果を作ります．'],['return で返す','結果を呼び出し元へ渡して関数を終了します．']],fstring:[['先頭に f を付ける','文字列を f で始めます．'],['波括弧を使う','{temp} の部分に変数の値が埋め込まれます．']]};const explanation=card('2．読み方を分解');const steps=guides[key]||[['構文の役割',t.description],['書き方の注意点',t.point]];steps.forEach((x,i)=>{const d=el('div','step');d.append(el('strong','',String(i+1)+'．'+x[0]),el('p','',x[1]));explanation.append(d)});const actual=card('3．今回貼り付けたコードでは');actual.append(el('p','muted','実際に抽出された行を確認しましょう．'));for(const hit of (t.hits||[]).slice(0,6)){actual.append(el('span','badge','行 '+hit.line),el('pre','code small',hit.sample))}const caution=card('4．覚えておきたいポイント');caution.append(el('div','tip',t.point));const learn=card('5．理解度を記録');const row=el('div','btn-row'),btn=el('button','',n.learned?.[key]?'✓ 理解済み（クリックで解除）':'この構文を理解した'),status=el('span','muted','進捗は元の画面を再表示すると反映されます．');btn.addEventListener('click',()=>{try{const all=JSON.parse(localStorage.getItem('code-reader-v2')||'[]'),target=all.find(x=>x.id===noteId);if(!target)throw Error();target.learned??={};target.learned[key]=!target.learned[key];localStorage.setItem('code-reader-v2',JSON.stringify(all));btn.textContent=target.learned[key]?'✓ 理解済み（クリックで解除）':'この構文を理解した';status.textContent='学習状況を保存しました．元の画面に戻って再表示すると反映されます．'}catch{status.textContent='保存できませんでした．'}});row.append(btn,status);learn.append(row)})();</script></body></html>
